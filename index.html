<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0056b3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Triage">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Email Triage</title>
<style>
  :root {
    --blue: #0056b3; --blue-dark: #003d82; --ink: #1e293b; --muted: #64748b; --line: #e2e8f0;
    --bg: #f8fafc; --card: #fff; --green: #10b981; --red: #dc2626; --amber: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh; min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark)); color: #fff;
    padding: calc(env(safe-area-inset-top) + .75rem) 1rem .75rem;
    display: flex; align-items: center; gap: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }
  header h1 { font-size: 1.15rem; font-weight: 650; flex: 1; }
  .pill { font-size: .75rem; background: rgba(255,255,255,.18); padding: .25rem .6rem; border-radius: 999px; white-space: nowrap; }
  .icon-btn { width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.18); color: #fff; font-size: 1.1rem; }

  main { max-width: 560px; margin: 0 auto; padding: 1rem 1rem calc(env(safe-area-inset-bottom) + 2rem); }
  .boot { color: var(--muted); text-align: center; padding: 3rem 0; }
  #fatal { background: #fee2e2; color: #7f1d1d; padding: .75rem 1rem; font-size: .9rem; }

  .banner { border-radius: 10px; padding: .65rem .9rem; margin-bottom: 1rem; font-size: .9rem; }
  .banner.offline { background: #fef3c7; color: #78350f; }
  .banner.sync { background: #e0f2fe; color: #075985; }
  .banner.err { background: #fee2e2; color: #7f1d1d; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .panel h2 { font-size: 1.2rem; margin-bottom: .6rem; }
  .panel p { color: var(--muted); font-size: .92rem; margin-bottom: .6rem; }
  .panel ol { color: var(--muted); font-size: .92rem; margin: 0 0 .9rem 1.2rem; }
  .panel ol li { margin-bottom: .25rem; }

  .primary {
    display: block; width: 100%; padding: 1.1rem; border-radius: 14px; color: #fff; font-weight: 650; font-size: 1.1rem;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark)); box-shadow: 0 4px 12px rgba(0,86,179,.28);
  }
  .primary small { display: block; font-weight: 500; font-size: .85rem; opacity: .85; }
  .secondary { display: block; width: 100%; padding: .85rem; border-radius: 12px; background: #e2e8f0; font-weight: 600; margin-top: .75rem; }
  .link { color: var(--blue); font-weight: 600; padding: .5rem 0; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin: 1rem 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .8rem .6rem; text-align: center; }
  .stat b { display: block; font-size: 1.6rem; color: var(--blue); line-height: 1.1; }
  .stat span { font-size: .75rem; color: var(--muted); }
  .note { font-size: .82rem; color: var(--muted); text-align: center; margin-top: 1rem; }

  .field { width: 100%; padding: .8rem; border: 1px solid var(--line); border-radius: 10px; font: 15px ui-monospace, Menlo, monospace; margin-bottom: .6rem; }
  .field:focus { outline: 2px solid var(--blue); border-color: transparent; }
  .error-text { color: var(--red); font-size: .88rem; margin-bottom: .6rem; }

  .email { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 1.25rem; box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .from { display: flex; justify-content: space-between; gap: .5rem; font-size: .9rem; color: var(--muted); margin-bottom: .6rem; }
  .from strong { color: var(--ink); overflow-wrap: anywhere; }
  .age { white-space: nowrap; }
  .age.old { color: var(--amber); font-weight: 600; }
  .subject { font-size: 1.12rem; font-weight: 650; margin-bottom: .7rem; overflow-wrap: anywhere; }
  .snippet { font-size: .9rem; color: var(--muted); background: #f1f5f9; border-radius: 8px; padding: .7rem; margin-bottom: .9rem; overflow-wrap: anywhere; }
  .suggest { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; border: 1px dashed #93c5fd; background: #eff6ff; border-radius: 10px; padding: .6rem .8rem; }
  .suggest .lbl { font-size: .75rem; color: var(--muted); display: block; }
  .suggest .cat { font-weight: 650; color: var(--blue); }
  .tier { font-size: .72rem; font-weight: 700; padding: .15rem .5rem; border-radius: 999px; background: #e2e8f0; color: #334155; }
  .tier.High { background: #d1fae5; color: #065f46; } .tier.Medium { background: #fef3c7; color: #78350f; } .tier.Low { background: #fee2e2; color: #7f1d1d; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: 1rem; }
  .act { padding: .95rem; border-radius: 12px; color: #fff; font-weight: 650; }
  .act.file { background: var(--green); } .act.del { background: var(--red); }
  .act.skip { grid-column: 1 / -1; background: #64748b; }
  .act:active, .primary:active { transform: translateY(1px); }
  .queue-info { text-align: center; color: var(--muted); font-size: .88rem; margin: 1rem 0 .25rem; }

  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 1.1rem 1rem calc(env(safe-area-inset-bottom) + 1rem); -webkit-overflow-scrolling: touch; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
  .sheet-head h3 { font-size: 1.1rem; }
  .close { width: 36px; height: 36px; border-radius: 50%; background: #f1f5f9; font-size: 1rem; }
  .opt { display: flex; width: 100%; text-align: left; align-items: center; gap: .6rem; padding: .8rem; border: 1px solid var(--line); border-radius: 10px; margin-bottom: .5rem; }
  .opt:active { background: #eff6ff; }
  .opt .grow { flex: 1; min-width: 0; }
  .opt .name { font-weight: 600; display: block; }
  .opt .desc { font-size: .8rem; color: var(--muted); display: block; }
  .opt.suggested { border-color: var(--blue); background: #eff6ff; }
  .disp { font-size: .7rem; font-weight: 700; padding: .15rem .45rem; border-radius: 6px; white-space: nowrap; }
  .disp.Archive { background: #e0f2fe; color: #075985; } .disp.Keep { background: #d1fae5; color: #065f46; } .disp.Delete { background: #fee2e2; color: #7f1d1d; }
  .confirm { text-align: center; padding: .5rem 0 .25rem; }
  .confirm .big { font-size: 2.5rem; }
  .confirm h3 { margin: .4rem 0; }
  .confirm p { color: var(--muted); font-size: .92rem; margin-bottom: 1rem; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  .btn-cancel { padding: .9rem; border-radius: 12px; background: #e2e8f0; font-weight: 600; }
  .btn-danger { padding: .9rem; border-radius: 12px; background: var(--red); color: #fff; font-weight: 650; }

  .list-item { border-top: 1px solid var(--line); padding: .6rem 0; font-size: .88rem; }
  .list-item:first-of-type { border-top: 0; }
  .list-item .meta { color: var(--muted); font-size: .8rem; }
  .list-item .err { color: var(--red); font-size: .8rem; }
  .mini { font-size: .8rem; font-weight: 600; color: var(--blue); margin-right: .9rem; padding: .3rem 0; }
  .mini.danger { color: var(--red); }

  #toast { position: fixed; left: 1rem; right: 1rem; bottom: calc(env(safe-area-inset-bottom) + 1rem); z-index: 60; display: flex; justify-content: center; pointer-events: none; }
  #toast div { background: var(--ink); color: #fff; padding: .75rem 1rem; border-radius: 10px; font-size: .92rem; max-width: 520px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  #toast div.success { background: #047857; } #toast div.error { background: var(--red); }
</style>
</head>
<body>
<header>
  <h1>📧 Email Triage</h1>
  <span class="pill" id="net-pill" hidden></span>
  <button class="icon-btn" id="settings-btn" aria-label="Settings" hidden>⚙️</button>
</header>
<div id="fatal" hidden></div>
<main id="app"><p class="boot">Loading…</p></main>
<div id="toast" aria-live="polite"></div>

<script>
'use strict';

// If anything in this script ever throws, say so on screen instead of leaving a blank page.
function showFatal(msg) {
  var el = document.getElementById('fatal');
  el.hidden = false;
  el.textContent = 'Something went wrong: ' + msg + '. Try reloading; if it keeps happening, tell Claude this exact message.';
}
window.addEventListener('error', function (e) { showFatal(e.message || 'script error'); });
window.addEventListener('unhandledrejection', function (e) { showFatal((e.reason && e.reason.message) || String(e.reason)); });

const APP_VERSION = '1.1.0';
const BASE = 'appxjiuh85jwY8bKO';
const TABLE = { CATEGORIES: 'tblcfRSlMxBl5d0Yu', PENDING: 'tbl6xMBhSmwZG1VFp' };

// Pending table field IDs. Airtable's display names for the first three are
// mislabelled; these IDs match what the scheduled triage task actually writes.
const P = {
  SENDER: 'fldVRJfEjaWLP5DUu',     // named "Email ID" in Airtable
  SUBJECT: 'fldwyRw1UVY2gZZSM',    // named "Sender" in Airtable
  THREAD: 'fldrfeaUQIxQRHsFG',     // named "Subject" in Airtable
  SNIPPET: 'fld4E1i0TO2Z3MeFg',
  SUGGESTED: 'fldDahr5RSiYnA5Aa',
  TIER: 'fldTSxLRrIcQhxZlS',
  STATUS: 'fldbTCyj1DH7w46j2',     // Pending | Reviewing | Filed
  QUEUED_AT: 'fldbx9FK8V7WclHZs',
  DECIDED_CATEGORY: 'fldAjTquVn7Vwafqg',
  DECIDED_ACTION: 'fldH57N0MmYYYPJu0', // Archive | Keep | Delete
  DECIDED_REASON: 'fld9jypIy53VnpH5H',
  DECIDED_AT: 'fldKZH0X2jDoEMNuJ',
};
const C = { NAME: 'fldacsrbrqKJhP5HT', LABEL: 'flde1THJbFcZRR2rB', DISPOSITION: 'fld5LXzRufnzKQbvA', NOTES: 'fldR2WFT0gq7rdyDf' };
const DELETE_REASONS = ['Spam', 'Unwanted newsletter', 'Duplicate', 'Already handled'];
const PAT_KEY = 'airtable_pat';
const CACHE_KEY = 'triage.cache.v1';

// ---------- small helpers ----------
const $ = (sel) => document.querySelector(sel);
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } }
function getPat() { return (lsGet(PAT_KEY) || '').trim(); }
function ago(iso) {
  const t = Date.parse(iso);
  if (!t) return '';
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60);
  if (h < 48) return h + 'h ago';
  return Math.round(h / 24) + 'd ago';
}
function isOld(iso) { const t = Date.parse(iso); return t && Date.now() - t > 48 * 3600 * 1000; }
function timeOfDay(ms) { return ms ? new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '—'; }

let toastTimer;
function toast(msg, kind) {
  const el = $('#toast');
  el.innerHTML = '<div class="' + (kind || '') + '">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.innerHTML = ''; }, 3200);
}

// ---------- offline outbox (IndexedDB, with localStorage fallback) ----------
const Outbox = (() => {
  const LS_KEY = 'triage.outbox';
  let dbPromise = null;
  let useLs = !('indexedDB' in window);
  function open() {
    if (!dbPromise) {
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open('email-triage-queue', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('decisions', { keyPath: 'recordId' });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        req.onblocked = () => reject(new Error('IndexedDB blocked'));
      });
    }
    return dbPromise;
  }
  async function run(mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('decisions', mode);
      const req = fn(tx.objectStore('decisions'));
      tx.oncomplete = () => resolve(req ? req.result : undefined);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  }
  function lsAll() { try { return JSON.parse(lsGet(LS_KEY) || '[]'); } catch (e) { return []; } }
  function lsSave(list) { lsSet(LS_KEY, JSON.stringify(list)); }
  async function safe(idbFn, lsFn) {
    if (!useLs) {
      try { return await idbFn(); } catch (e) { useLs = true; }
    }
    return lsFn();
  }
  return {
    all: () => safe(() => run('readonly', (s) => s.getAll()), () => lsAll()),
    put: (d) => safe(() => run('readwrite', (s) => s.put(d)), () => { lsSave(lsAll().filter((x) => x.recordId !== d.recordId).concat([d])); }),
    del: (id) => safe(() => run('readwrite', (s) => s.delete(id)), () => { lsSave(lsAll().filter((x) => x.recordId !== id)); }),
  };
})();

// ---------- Airtable ----------
class ApiError extends Error {
  constructor(status, message) { super(message); this.status = status; }
}
async function airtable(path, opts) {
  opts = opts || {};
  const pat = opts.pat || getPat();
  if (!pat) throw new ApiError(401, 'No Airtable token set');
  const qs = opts.params ? '?' + opts.params.toString() : '';
  const headers = { Authorization: 'Bearer ' + pat };
  if (opts.body) headers['Content-Type'] = 'application/json';
  let res;
  try {
    res = await fetch('https://api.airtable.com/v0/' + BASE + '/' + path + qs, {
      method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: 'no-store',
    });
  } catch (e) {
    throw new ApiError(0, 'Can’t reach Airtable (offline?)');
  }
  if (!res.ok) {
    let msg = 'Airtable error ' + res.status;
    try {
      const j = await res.json();
      const e = j && j.error;
      if (e) msg += ': ' + (typeof e === 'string' ? e : (e.message || e.type));
    } catch (e) { /* no JSON body */ }
    throw new ApiError(res.status, msg);
  }
  return res.json();
}
async function listAll(table, formula) {
  const out = [];
  let offset;
  do {
    const p = new URLSearchParams({ returnFieldsByFieldId: 'true', pageSize: '100' });
    if (formula) p.set('filterByFormula', formula);
    if (offset) p.set('offset', offset);
    const j = await airtable(table, { params: p });
    out.push.apply(out, j.records || []);
    offset = j.offset;
  } while (offset);
  return out;
}
async function listPendingRows() {
  try {
    return await listAll(TABLE.PENDING, "{Status}='Pending'");
  } catch (e) {
    // If the Status field is ever renamed the formula fails (422); fall back to filtering here.
    if (e.status !== 422) throw e;
    return (await listAll(TABLE.PENDING)).filter((r) => r.fields[P.STATUS] === 'Pending');
  }
}
function mapEmail(r) {
  const f = r.fields || {};
  return {
    id: r.id, sender: f[P.SENDER] || 'Unknown sender', subject: f[P.SUBJECT] || '(no subject)',
    snippet: f[P.SNIPPET] || '', suggested: f[P.SUGGESTED] || '', tier: f[P.TIER] || '',
    queuedAt: f[P.QUEUED_AT] || r.createdTime || '',
  };
}
function mapCategory(r) {
  const f = r.fields || {};
  return { id: r.id, name: (f[C.NAME] || '').trim(), label: f[C.LABEL] || '', disposition: f[C.DISPOSITION] || '', notes: f[C.NOTES] || '' };
}

// ---------- state ----------
const S = {
  view: 'boot',          // setup | home | triage | settings
  queue: [],             // pending emails still to decide (local order; Skip moves to end)
  categories: [],
  outbox: [],
  loading: false,
  loadError: '',
  lastLoaded: 0,
  online: navigator.onLine,
  syncing: false,
  sheet: null,           // { type: 'file' | 'delete' | 'confirm', reason }
  setupError: '',
  setupBusy: false,
};

function saveCache() {
  lsSet(CACHE_KEY, JSON.stringify({ queue: S.queue, categories: S.categories, lastLoaded: S.lastLoaded }));
}
function loadCache() {
  try {
    const c = JSON.parse(lsGet(CACHE_KEY) || 'null');
    if (c) { S.queue = c.queue || []; S.categories = c.categories || []; S.lastLoaded = c.lastLoaded || 0; }
  } catch (e) { /* ignore bad cache */ }
}
function categoryByName(name) {
  const n = (name || '').toLowerCase();
  return S.categories.find((c) => c.name.toLowerCase() === n);
}

async function refreshOutbox() { S.outbox = (await Outbox.all()) || []; }

async function loadData() {
  if (!getPat()) return;
  S.loading = true; S.loadError = ''; render();
  try {
    const [cats, rows] = await Promise.all([listAll(TABLE.CATEGORIES), listPendingRows()]);
    await refreshOutbox();
    const decided = new Set(S.outbox.map((d) => d.recordId));
    S.categories = cats.map(mapCategory).filter((c) => c.name).sort((a, b) => a.name.localeCompare(b.name));
    S.queue = rows.map(mapEmail).filter((e) => !decided.has(e.id)).sort((a, b) => String(a.queuedAt).localeCompare(String(b.queuedAt)));
    S.lastLoaded = Date.now();
    saveCache();
  } catch (e) {
    S.loadError = e.status === 401 || e.status === 403
      ? 'Airtable rejected the saved token. Open ⚙️ Settings and enter a new one.'
      : e.message;
  } finally {
    S.loading = false; render();
  }
}

// ---------- decisions + sync ----------
async function decide(email, decision) {
  const d = {
    recordId: email.id, category: decision.category || '', action: decision.action, reason: decision.reason || '',
    decidedAt: new Date().toISOString(), status: 'queued', attempts: 0, error: '',
    summary: email.sender + ' — ' + email.subject,
  };
  await Outbox.put(d);
  S.queue = S.queue.filter((e) => e.id !== email.id);
  S.sheet = null;
  saveCache();
  await refreshOutbox();
  if (decision.action === 'Delete' && decision.reason) toast('🗑️ Marked for deletion (' + decision.reason + ')', 'success');
  else if (decision.action === 'Delete') toast('Filed to ' + decision.category + ' — will be deleted', 'success');
  else toast('✓ Filed to ' + decision.category, 'success');
  render();
  flush();
}

let flushing = false;
let retryTimer = null;
function scheduleRetry(attempts) {
  clearTimeout(retryTimer);
  const ms = Math.min(60000, 1000 * Math.pow(2, Math.min(attempts - 1, 6)));
  retryTimer = setTimeout(flush, ms);
}
async function flush() {
  if (flushing || !getPat()) return;
  flushing = true; S.syncing = true; renderChrome();
  let superseded = 0;
  try {
    const items = ((await Outbox.all()) || []).filter((d) => d.status !== 'error')
      .sort((a, b) => String(a.decidedAt).localeCompare(String(b.decidedAt)));
    for (const d of items) {
      try {
        // Only write if the row is still Pending — if it was filed elsewhere meanwhile, leave it alone.
        const rec = await airtable(TABLE.PENDING + '/' + d.recordId, { params: new URLSearchParams({ returnFieldsByFieldId: 'true' }) });
        if ((rec.fields || {})[P.STATUS] !== 'Pending') { superseded++; await Outbox.del(d.recordId); continue; }
        const fields = {};
        fields[P.STATUS] = 'Reviewing';
        fields[P.DECIDED_CATEGORY] = d.category || null;
        fields[P.DECIDED_ACTION] = d.action;
        fields[P.DECIDED_REASON] = d.reason || null;
        fields[P.DECIDED_AT] = d.decidedAt;
        await airtable(TABLE.PENDING, { method: 'PATCH', body: { records: [{ id: d.recordId, fields }] } });
        await Outbox.del(d.recordId);
      } catch (e) {
        if (e.status === 0 || e.status === 429 || e.status >= 500) {
          d.attempts = (d.attempts || 0) + 1; d.error = e.message;
          await Outbox.put(d);
          if (S.online) scheduleRetry(d.attempts);
          break; // try the rest later, in order
        }
        if (e.status === 404) { await Outbox.del(d.recordId); continue; } // row no longer exists
        d.status = 'error'; d.error = e.message;
        await Outbox.put(d);
      }
    }
  } finally {
    flushing = false; S.syncing = false;
    await refreshOutbox();
    if (superseded) toast(superseded + ' email' + (superseded > 1 ? 's were' : ' was') + ' already filed elsewhere — skipped');
    render();
  }
}

// ---------- rendering ----------
function renderChrome() {
  const pill = $('#net-pill');
  const waiting = S.outbox.filter((d) => d.status !== 'error').length;
  let txt = '';
  if (!S.online) txt = '📡 Offline';
  else if (S.syncing) txt = 'Syncing…';
  else if (waiting) txt = waiting + ' to sync';
  pill.hidden = !txt; pill.textContent = txt;
  $('#settings-btn').hidden = S.view === 'setup' && !getPat();
}

function banners() {
  let h = '';
  const waiting = S.outbox.filter((d) => d.status !== 'error').length;
  const errors = S.outbox.filter((d) => d.status === 'error').length;
  if (!S.online) h += '<div class="banner offline">📡 Working offline · decisions will sync when you’re back online</div>';
  else if (waiting) h += '<div class="banner sync">Syncing ' + waiting + ' decision' + (waiting > 1 ? 's' : '') + '…</div>';
  if (errors) h += '<div class="banner err">' + errors + ' decision' + (errors > 1 ? 's' : '') + ' couldn’t be saved. <button class="link" data-act="settings">Review in Settings</button></div>';
  if (S.loadError) h += '<div class="banner err">' + esc(S.loadError) + '</div>';
  return h;
}

function viewSetup() {
  return '<div class="panel">' +
    '<h2>🔑 Connect to Airtable</h2>' +
    '<p>Paste an Airtable personal access token. It is stored only on this device.</p>' +
    '<ol><li>airtable.com → your avatar → <b>Builder hub</b> → <b>Personal access tokens</b></li>' +
    '<li><b>Create token</b>, scopes <b>data.records:read</b> and <b>data.records:write</b></li>' +
    '<li>Access: the <b>Email Triage v2</b> base</li><li>Copy the token and paste it below</li></ol>' +
    '<input class="field" id="pat-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="pat…">' +
    (S.setupError ? '<div class="error-text">' + esc(S.setupError) + '</div>' : '') +
    '<button class="primary" data-act="save-token"' + (S.setupBusy ? ' disabled' : '') + '>' + (S.setupBusy ? 'Checking…' : 'Save & continue') + '</button>' +
    (getPat() ? '<button class="secondary" data-act="home">Cancel</button>' : '') +
    '</div>';
}

function viewHome() {
  const n = S.queue.length;
  const toSync = S.outbox.length;
  let h = banners();
  if (S.loading && !S.lastLoaded) return h + '<p class="boot">Loading your queue…</p>';
  h += n
    ? '<button class="primary" data-act="start">▶ Start triage<small>' + n + ' email' + (n > 1 ? 's' : '') + ' waiting</small></button>'
    : '<div class="panel" style="text-align:center"><h2>🎉 All clear</h2><p>Nothing waiting for review right now.</p></div>';
  h += '<div class="stats">' +
    '<div class="stat"><b>' + n + '</b><span>Waiting</span></div>' +
    '<div class="stat"><b>' + toSync + '</b><span>To sync</span></div>' +
    '<div class="stat"><b style="font-size:1.1rem;line-height:1.6rem">' + timeOfDay(S.lastLoaded) + '</b><span>Refreshed</span></div></div>';
  h += '<button class="secondary" data-act="refresh"' + (S.loading ? ' disabled' : '') + '>' + (S.loading ? 'Refreshing…' : '↻ Refresh queue') + '</button>';
  h += '<p class="note">Your decisions are saved to Airtable straight away and applied in Gmail at the next scheduled run (5am, 11am, 3pm, 9pm).</p>';
  return h;
}

function viewTriage() {
  const e = S.queue[0];
  let h = banners();
  if (!e) {
    return h + '<div class="panel" style="text-align:center"><h2>✅ Done</h2><p>You’ve worked through the queue.</p>' +
      '<button class="primary" data-act="home">Back to home</button></div>';
  }
  const cat = categoryByName(e.suggested);
  h += '<article class="email">' +
    '<div class="from"><strong>' + esc(e.sender) + '</strong><span class="age' + (isOld(e.queuedAt) ? ' old' : '') + '">' + esc(ago(e.queuedAt)) + '</span></div>' +
    '<div class="subject">' + esc(e.subject) + '</div>' +
    (e.snippet ? '<div class="snippet">' + esc(e.snippet.slice(0, 160)) + (e.snippet.length > 160 ? '…' : '') + '</div>' : '') +
    '<button class="suggest" data-act="open-file"><span><span class="lbl">Suggested category</span><span class="cat">' +
      esc(e.suggested || 'None') + '</span>' + (cat ? ' <span class="disp ' + esc(cat.disposition) + '">' + esc(cat.disposition) + '</span>' : '') +
    '</span>' + (e.tier ? '<span class="tier ' + esc(e.tier) + '">' + esc(e.tier) + '</span>' : '') + '</button>' +
    '<div class="actions">' +
      '<button class="act file" data-act="open-file">📁 File</button>' +
      '<button class="act del" data-act="open-delete">🗑️ Delete</button>' +
      '<button class="act skip" data-act="skip"' + (S.queue.length < 2 ? ' disabled' : '') + '>⏭ Skip for now</button>' +
    '</div></article>' +
    '<p class="queue-info">' + S.queue.length + ' email' + (S.queue.length > 1 ? 's' : '') + ' pending in queue</p>' +
    '<button class="secondary" data-act="home">← Home</button>';
  return h;
}

function viewSettings() {
  const pat = getPat();
  let h = '<div class="panel"><h2>Airtable token</h2>' +
    '<p>' + (pat ? 'Saved on this device, ending <b>…' + esc(pat.slice(-4)) + '</b>.' : 'No token saved.') + '</p>' +
    '<button class="secondary" data-act="change-token">Change token</button>' +
    (pat ? '<button class="secondary" data-act="forget-token">Remove token from this device</button>' : '') + '</div>';
  h += '<div class="panel"><h2>Waiting to sync</h2>';
  if (!S.outbox.length) h += '<p>Everything is synced ✓</p>';
  S.outbox.forEach((d) => {
    h += '<div class="list-item"><div>' + esc(d.summary || d.recordId) + '</div>' +
      '<div class="meta">' + esc(d.action === 'Delete' && d.reason ? 'Delete · ' + d.reason : d.category + ' · ' + d.action) + '</div>' +
      (d.error ? '<div class="err">' + esc(d.error) + '</div>' : '') +
      (d.status === 'error' ? '<button class="mini" data-act="retry" data-id="' + esc(d.recordId) + '">Retry</button><button class="mini danger" data-act="discard" data-id="' + esc(d.recordId) + '">Discard</button>' : '') +
      '</div>';
  });
  if (S.outbox.length) h += '<button class="secondary" data-act="sync-now"' + (S.syncing ? ' disabled' : '') + '>Sync now</button>';
  h += '</div>';
  h += '<p class="note">Email Triage v' + APP_VERSION + ' · base ' + BASE + '</p>';
  h += '<button class="secondary" data-act="home">← Home</button>';
  return h;
}

function viewSheet() {
  const sh = S.sheet;
  const e = S.queue[0];
  if (!sh || !e) return '';
  let inner = '';
  if (sh.type === 'file') {
    const sug = categoryByName(e.suggested);
    const cats = sug ? [sug].concat(S.categories.filter((c) => c !== sug)) : S.categories;
    inner = '<div class="sheet-head"><h3>File to category</h3><button class="close" data-act="close" aria-label="Close">✕</button></div>';
    if (!cats.length) inner += '<p class="note">No categories loaded — go back and tap Refresh.</p>';
    cats.forEach((c) => {
      inner += '<button class="opt' + (c === sug ? ' suggested' : '') + '" data-act="file" data-cat="' + esc(c.name) + '">' +
        '<span class="grow"><span class="name">' + esc(c.name) + (c === sug ? ' · suggested' : '') + '</span>' +
        (c.notes ? '<span class="desc">' + esc(c.notes) + '</span>' : '') + '</span>' +
        (c.disposition ? '<span class="disp ' + esc(c.disposition) + '">' + esc(c.disposition) + '</span>' : '') + '</button>';
    });
  } else if (sh.type === 'delete') {
    inner = '<div class="sheet-head"><h3>Why delete this email?</h3><button class="close" data-act="close" aria-label="Close">✕</button></div>';
    DELETE_REASONS.forEach((r) => {
      inner += '<button class="opt" data-act="pick-reason" data-reason="' + esc(r) + '"><span class="grow"><span class="name">' + esc(r) + '</span></span></button>';
    });
  } else if (sh.type === 'confirm') {
    inner = '<div class="confirm"><div class="big">🗑️</div><h3>Delete as ' + esc(sh.reason) + '?</h3>' +
      '<p>This email will be moved to the Gmail Bin at the next scheduled run.</p>' +
      '<div class="row"><button class="btn-cancel" data-act="close">Cancel</button><button class="btn-danger" data-act="confirm-delete">Delete</button></div></div>';
  }
  return '<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true">' + inner + '</div></div>';
}

function render() {
  renderChrome();
  let h = '';
  if (S.view === 'setup') h = viewSetup();
  else if (S.view === 'home') h = viewHome();
  else if (S.view === 'triage') h = viewTriage() + viewSheet();
  else if (S.view === 'settings') h = viewSettings();
  else h = '<p class="boot">Loading…</p>';
  const typed = $('#pat-input') ? $('#pat-input').value : '';
  $('#app').innerHTML = h;
  if ($('#pat-input')) { $('#pat-input').value = typed; }
}

function go(view) { S.view = view; S.sheet = null; window.scrollTo(0, 0); render(); }

// ---------- actions ----------
async function saveToken() {
  const input = $('#pat-input');
  const v = (input ? input.value : '').trim();
  S.setupError = '';
  if (!/^pat\w{8,}\.\w{20,}$/.test(v)) {
    S.setupError = 'That doesn’t look like an Airtable token — it should start with “pat” and contain a dot.';
    return render();
  }
  if (!S.online) { S.setupError = 'You’re offline — connect to the internet so the token can be checked.'; return render(); }
  S.setupBusy = true; render();
  try {
    await airtable(TABLE.CATEGORIES, { pat: v, params: new URLSearchParams({ pageSize: '1', returnFieldsByFieldId: 'true' }) });
    lsSet(PAT_KEY, v);
    S.setupBusy = false; S.loadError = '';
    $('#pat-input').value = '';
    go('home');
    await loadData();
    flush();
  } catch (e) {
    S.setupBusy = false;
    S.setupError = e.status === 401 || e.status === 403 || e.status === 404
      ? 'Airtable rejected this token (' + e.message + '). Check it has data.records:read and data.records:write on the Email Triage v2 base.'
      : e.message;
    render();
  }
}

document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'overlay' && ev.target !== el) return; // clicks inside the sheet
  const e = S.queue[0];
  switch (act) {
    case 'save-token': return saveToken();
    case 'home': return go(getPat() ? 'home' : 'setup');
    case 'settings': return go('settings');
    case 'start': return go('triage');
    case 'refresh': return loadData();
    case 'skip':
      if (S.queue.length > 1) { S.queue.push(S.queue.shift()); saveCache(); render(); }
      return;
    case 'open-file': S.sheet = { type: 'file' }; return render();
    case 'open-delete': S.sheet = { type: 'delete' }; return render();
    case 'pick-reason': S.sheet = { type: 'confirm', reason: el.dataset.reason }; return render();
    case 'close': case 'overlay': S.sheet = null; return render();
    case 'file': {
      const c = categoryByName(el.dataset.cat);
      if (!e || !c) return;
      return decide(e, { category: c.name, action: c.disposition || 'Archive' });
    }
    case 'confirm-delete':
      if (!e || !S.sheet) return;
      return decide(e, { action: 'Delete', reason: S.sheet.reason });
    case 'change-token': S.setupError = ''; return go('setup');
    case 'forget-token':
      lsDel(PAT_KEY); lsDel(CACHE_KEY); S.queue = []; S.categories = []; S.lastLoaded = 0; S.setupError = '';
      return go('setup');
    case 'sync-now': return flush();
    case 'retry': {
      const d = S.outbox.find((x) => x.recordId === el.dataset.id);
      if (d) { d.status = 'queued'; d.error = ''; d.attempts = 0; await Outbox.put(d); await refreshOutbox(); render(); flush(); }
      return;
    }
    case 'discard': {
      await Outbox.del(el.dataset.id); await refreshOutbox();
      toast('Discarded — tap Refresh on the home screen to see that email again');
      return render();
    }
  }
});

document.getElementById('settings-btn').addEventListener('click', () => go('settings'));
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'pat-input') saveToken();
  if (ev.key === 'Escape' && S.sheet) { S.sheet = null; render(); }
});
window.addEventListener('online', () => { S.online = true; render(); flush(); });
window.addEventListener('offline', () => { S.online = false; render(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.online) flush();
});

// ---------- start ----------
(async function boot() {
  try { await refreshOutbox(); } catch (e) { S.outbox = []; }
  loadCache();
  if (!getPat()) { go('setup'); return; }
  go('home');
  await loadData();
  flush();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}
</script>
</body>
