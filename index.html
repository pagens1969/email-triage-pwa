<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pigeonhole">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" media="print" onload="this.media='all'">
<title>Pigeonhole</title>
<style>
  :root {
    --bg: #faf9f5; --surface: #ffffff; --surface-2: #f2f0e8; --ink: #1f1e1b; --muted: #6f6c63; --line: #e7e3d8;
    --accent: #c96442; --accent-press: #b5573a; --accent-soft: #f6e7df; --on-accent: #ffffff;
    --danger: #b3412e; --danger-soft: #f7e3de; --ok: #2f7d5b; --ok-soft: #e2efe8; --info: #3d6a8a; --info-soft: #e3ecf2;
    --amber: #a86a12; --shadow: 0 1px 2px rgba(31,30,27,.05), 0 8px 24px rgba(31,30,27,.08);
    --sans: "DM Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --serif: "Source Serif 4", ui-serif, Georgia, "Times New Roman", serif;
    --ease-out: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b18; --surface: #262521; --surface-2: #2f2d28; --ink: #f1eee5; --muted: #a8a397; --line: #3a3832;
      --accent: #d97757; --accent-press: #c96442; --accent-soft: #3b2a22; --on-accent: #1c1b18;
      --danger: #e27a66; --danger-soft: #3d2521; --ok: #6cc29a; --ok-soft: #1f3329; --info: #8fb8d6; --info-soft: #22303a;
      --amber: #e0a54a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font: 16px/1.5 var(--sans); background: var(--bg); color: var(--ink);
    min-height: 100vh; min-height: 100dvh; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  svg { display: block; }
  [hidden] { display: none !important; }
  .serif { font-family: var(--serif); letter-spacing: -.01em; }

  /* ---------- top bar ---------- */
  header {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .5rem;
    padding: calc(env(safe-area-inset-top) + .6rem) 1rem .6rem;
    background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  }
  header .title { flex: 1; font-family: var(--serif); font-size: 1.35rem; font-weight: 600; letter-spacing: -.015em; display: flex; align-items: center; gap: .5rem; }
  header .title .mark { width: 22px; height: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  header .title .mark i { border-radius: 2px; background: var(--line); }
  header .title .mark i.on { background: var(--accent); }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); }
  .icon-btn:active { background: var(--surface-2); }
  .pill { font-size: .75rem; font-weight: 600; padding: .3rem .65rem; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .pill.off { background: var(--danger-soft); color: var(--danger); }

  main { max-width: 540px; margin: 0 auto; padding: .5rem 1rem calc(env(safe-area-inset-bottom) + 2rem); }
  .boot { color: var(--muted); text-align: center; padding: 4rem 0; }
  #fatal { background: var(--danger-soft); color: var(--danger); padding: .75rem 1rem; font-size: .9rem; }

  .banner { border-radius: 14px; padding: .7rem .9rem; margin-bottom: .9rem; font-size: .88rem; display: flex; gap: .5rem; align-items: center; }
  .banner.offline { background: var(--danger-soft); color: var(--danger); }
  .banner.sync { background: var(--info-soft); color: var(--info); }
  .banner.err { background: var(--danger-soft); color: var(--danger); }
  .banner .link { color: inherit; text-decoration: underline; font-weight: 600; }

  /* ---------- generic ---------- */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 1.35rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
  .panel h2 { font-family: var(--serif); font-weight: 600; font-size: 1.35rem; margin-bottom: .5rem; letter-spacing: -.01em; }
  .panel p { color: var(--muted); font-size: .92rem; margin-bottom: .6rem; }
  .panel ol { color: var(--muted); font-size: .9rem; margin: 0 0 1rem 1.1rem; }
  .panel ol li { margin-bottom: .3rem; }
  .panel b { color: var(--ink); font-weight: 600; }
  .btn { display: flex; align-items: center; justify-content: center; gap: .5rem; width: 100%; padding: .95rem 1rem; border-radius: 16px; font-weight: 600; font-size: 1rem; transition: transform .12s var(--ease-out), background .15s; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.primary:active { background: var(--accent-press); }
  .btn.ghost { background: var(--surface-2); color: var(--ink); margin-top: .6rem; }
  .field { width: 100%; padding: .9rem 1rem; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); font: 16px ui-monospace, Menlo, monospace; margin-bottom: .7rem; }
  .field:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .field.sans { font: 16px var(--sans); }
  .disp-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-bottom: .7rem; }
  .dpill { padding: .65rem .5rem; border-radius: 12px; background: var(--surface-2); font-weight: 600; font-size: .88rem; text-align: center; border: 2px solid transparent; transition: transform .1s; }
  .dpill:active { transform: scale(.96); }
  .dpill.Archive.sel { background: var(--info-soft); color: var(--info); border-color: var(--info); }
  .dpill.Keep.sel { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
  .dpill.Delete.sel { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
  .opt.new-cat { color: var(--accent); }
  .error-text { color: var(--danger); font-size: .88rem; margin-bottom: .7rem; }
  .note { font-size: .82rem; color: var(--muted); text-align: center; margin-top: 1.1rem; line-height: 1.45; }

  /* ---------- home ---------- */
  .hero { padding: 1.6rem .25rem 1.4rem; }
  .hero .num { font-family: var(--serif); font-size: 4.2rem; font-weight: 600; line-height: 1; letter-spacing: -.03em; }
  .hero .lbl { color: var(--muted); font-size: 1.05rem; margin-top: .35rem; }
  .run { display: flex; align-items: center; gap: .85rem; width: 100%; text-align: left; margin-top: .75rem; padding: .9rem 1rem; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); transition: transform .12s var(--ease-out); }
  .run:active:not(:disabled) { transform: scale(.98); }
  .run .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
  .run .tx { flex: 1; min-width: 0; }
  .run b { display: block; font-weight: 600; }
  .run span { display: block; font-size: .8rem; color: var(--muted); }
  .run.spin .ic svg { animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .run:disabled { opacity: .75; }
  .run-err { color: var(--danger); font-size: .82rem; margin-top: .45rem; padding: 0 .2rem; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin: 1rem 0 .2rem; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: .85rem 1rem; }
  .stat b { display: block; font-size: 1.2rem; font-weight: 600; }
  .stat span { font-size: .78rem; color: var(--muted); }

  /* ---------- triage ---------- */
  .progress { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--muted); margin: .2rem .15rem .7rem; }
  .bar { height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin: 0 .15rem 1rem; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s var(--ease-out); }
  .stack { position: relative; }
  .card {
    position: relative; z-index: 2; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 1.3rem 1.25rem 1.2rem;
    box-shadow: var(--shadow); transform-origin: 50% 100%; will-change: transform, opacity;
  }
  .card.behind { position: absolute; left: 0; right: 0; top: 0; z-index: 1; transform: translateY(14px) scale(.95); opacity: .7; pointer-events: none; }
  .card.behind > * { visibility: hidden; }
  .sender { display: flex; align-items: center; gap: .75rem; margin-bottom: 1rem; }
  .avatar { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-weight: 700; font-size: 1.05rem; color: #fff; flex: none; }
  .sender .who { flex: 1; min-width: 0; }
  .sender .who b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sender .who span { display: block; font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .age { font-size: .78rem; color: var(--muted); white-space: nowrap; font-weight: 500; }
  .age.old { color: var(--amber); font-weight: 700; }
  .subject { font-family: var(--serif); font-size: 1.32rem; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; margin-bottom: .7rem; overflow-wrap: anywhere; }
  .snippet { font-size: .9rem; color: var(--muted); line-height: 1.5; margin-bottom: 1.1rem; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .cat-row { border-top: 1px solid var(--line); padding-top: .95rem; }
  .cat-row .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: .45rem; display: flex; justify-content: space-between; }
  .chip { display: flex; align-items: center; gap: .6rem; width: 100%; text-align: left; padding: .75rem .85rem; border-radius: 14px; background: var(--surface-2); transition: transform .12s var(--ease-out); }
  .chip:active { transform: scale(.98); }
  .chip .name { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .change { font-size: .8rem; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: .15rem; }
  .chip.empty .name { color: var(--muted); font-weight: 500; }
  .chip.pulse { animation: pulse .6s var(--ease-out); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
  .disp { font-size: .7rem; font-weight: 700; padding: .2rem .5rem; border-radius: 8px; white-space: nowrap; }
  .disp.Archive { background: var(--info-soft); color: var(--info); }
  .disp.Keep { background: var(--ok-soft); color: var(--ok); }
  .disp.Delete { background: var(--danger-soft); color: var(--danger); }
  .conf { font-size: .72rem; font-weight: 600; letter-spacing: 0; text-transform: none; display: inline-flex; align-items: center; gap: .3rem; }
  .conf i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .conf.High i { background: var(--ok); } .conf.Medium i { background: var(--amber); } .conf.Low i { background: var(--danger); }
  .changed { font-size: .72rem; color: var(--accent); font-weight: 600; margin-top: .4rem; }

  .actions { position: sticky; bottom: 0; z-index: 5; display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: .6rem; padding: 1rem 0 calc(env(safe-area-inset-bottom) + .6rem); background: linear-gradient(to bottom, transparent, var(--bg) 30%); }
  .act { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; padding: .8rem .5rem; border-radius: 18px; font-weight: 600; font-size: .9rem; transition: transform .12s var(--ease-out); min-height: 64px; }
  .act:active:not(:disabled) { transform: scale(.95); }
  .act small { font-size: .72rem; font-weight: 500; opacity: .85; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act.skip { background: var(--surface-2); color: var(--ink); }
  .act.del { background: var(--danger-soft); color: var(--danger); }
  .act.file { background: var(--accent); color: var(--on-accent); }
  .queue-info { text-align: center; color: var(--muted); font-size: .82rem; margin-top: .9rem; }
  .done { text-align: center; padding: 3rem 1rem; }
  .done .big { font-size: 3rem; margin-bottom: .5rem; }
  .done h2 { font-family: var(--serif); font-size: 1.6rem; margin-bottom: .4rem; }
  .done p { color: var(--muted); margin-bottom: 1.4rem; }

  /* ---------- card motion ---------- */
  .card.in { animation: cardIn .38s var(--ease-out) both; }
  @keyframes cardIn { from { transform: translateY(14px) scale(.95); opacity: .6; } to { transform: none; opacity: 1; } }
  .card.out-file { animation: outFile .5s cubic-bezier(.5,0,.75,.2) forwards; }
  @keyframes outFile {
    0% { transform: none; }
    20% { transform: translateX(-12px) rotate(-2deg); }
    100% { transform: translate(120vw, -12vh) rotate(18deg); opacity: .9; }
  }
  .card.out-skip { animation: outSkip .45s cubic-bezier(.5,0,.75,.2) forwards; }
  @keyframes outSkip {
    0% { transform: none; }
    100% { transform: translate(-115vw, 4vh) rotate(-14deg); opacity: .9; }
  }
  .card.out-delete { animation: outDelete .62s cubic-bezier(.55,0,.7,.25) forwards; }
  @keyframes outDelete {
    0% { transform: none; opacity: 1; }
    25% { transform: translateY(-10px) scale(.92) rotate(-2deg); opacity: 1; }
    100% { transform: translateY(58vh) scale(.08) rotate(-18deg); opacity: 0; }
  }
  .stamp { position: absolute; top: 4.6rem; right: 1.2rem; background: var(--surface); z-index: 3; font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; padding: .35rem .6rem; border-radius: 10px; border: 2px solid currentColor; transform: rotate(8deg) scale(.6); opacity: 0; pointer-events: none; }
  .card.out-file .stamp.file { color: var(--ok); animation: stamp .25s var(--ease-out) forwards; }
  .card.out-skip .stamp.skip { color: var(--muted); left: 1.2rem; right: auto; transform: rotate(-8deg) scale(.6); animation: stamp .2s var(--ease-out) forwards; }
  @keyframes stamp { to { opacity: 1; transform: rotate(8deg) scale(1); } }
  .bin { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px); z-index: 30; width: 76px; height: 76px; margin-left: -38px; border-radius: 26px; background: var(--danger); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(179,65,46,.35); transform: scale(0); pointer-events: none; }
  .bin.show { animation: binLife .9s var(--ease-out) forwards; }
  .bin .lid { transform-origin: 20% 90%; }
  .bin.show .lid { animation: lid .9s var(--ease-out) forwards; }
  @keyframes binLife { 0% { transform: scale(0); } 18% { transform: scale(1.08); } 28%, 72% { transform: scale(1); } 82% { transform: scale(1.12); } 100% { transform: scale(0); opacity: 0; } }
  @keyframes lid { 0%, 15% { transform: none; } 30%, 62% { transform: rotate(-28deg) translateY(-2px); } 75%, 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .card.in, .card.out-file, .card.out-skip, .card.out-delete, .bin.show, .sheet, .chip.pulse { animation-duration: .01s !important; }
  }

  /* ---------- sheets ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(20,19,17,.45); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease both; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { background: var(--surface); width: 100%; max-width: 540px; max-height: 86vh; overflow-y: auto; border-radius: 26px 26px 0 0; padding: .6rem 1rem calc(env(safe-area-inset-bottom) + 1rem); animation: sheetUp .32s var(--ease-out) both; -webkit-overflow-scrolling: touch; }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  .overlay.closing { animation: fadeOut .18s ease forwards; }
  .overlay.closing .sheet { animation: sheetDown .18s ease-in forwards; }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes sheetDown { to { transform: translateY(100%); } }
  .grab { width: 40px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto .8rem; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .8rem; }
  .sheet-head h3 { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; }
  .close { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
  .opt { display: flex; width: 100%; text-align: left; align-items: center; gap: .7rem; padding: .85rem .9rem; border-radius: 14px; margin-bottom: .35rem; transition: background .12s; }
  .opt:active { background: var(--surface-2); }
  .opt .grow { flex: 1; min-width: 0; }
  .opt .name { font-weight: 600; display: block; }
  .opt .desc { font-size: .8rem; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt.current { background: var(--accent-soft); }
  .opt .tick { color: var(--accent); width: 20px; }
  .tag { font-size: .68rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin-left: .35rem; }
  .confirm { text-align: center; padding: .4rem 0 .2rem; }
  .confirm .bin-icon { width: 64px; height: 64px; border-radius: 22px; background: var(--danger-soft); color: var(--danger); display: grid; place-items: center; margin: 0 auto .7rem; }
  .confirm h3 { font-family: var(--serif); font-size: 1.35rem; margin-bottom: .35rem; }
  .confirm p { color: var(--muted); font-size: .92rem; margin-bottom: 1.2rem; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  .btn.danger { background: var(--danger); color: #fff; }

  /* ---------- settings ---------- */
  .list-item { border-top: 1px solid var(--line); padding: .7rem 0; font-size: .88rem; }
  .list-item:first-of-type { border-top: 0; }
  .list-item .meta { color: var(--muted); font-size: .8rem; }
  .list-item .err { color: var(--danger); font-size: .8rem; }
  .cat-item { display: flex; align-items: center; justify-content: space-between; gap: .6rem; width: 100%; text-align: left; }
  .cat-item .grow { flex: 1; min-width: 0; }
  .cat-item b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-item .meta { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini { font-size: .82rem; font-weight: 600; color: var(--accent); margin-right: 1rem; padding: .35rem 0; }
  .mini.danger { color: var(--danger); }

  #toast { position: fixed; left: 1rem; right: 1rem; bottom: calc(env(safe-area-inset-bottom) + 96px); z-index: 60; display: flex; justify-content: center; pointer-events: none; }
  #toast div { background: var(--ink); color: var(--bg); padding: .7rem 1.05rem; border-radius: 999px; font-size: .88rem; font-weight: 500; max-width: 480px; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: toastIn .3s var(--ease-out) both; }
  #toast div.error { background: var(--danger); color: #fff; }
  @keyframes toastIn { from { transform: translateY(12px); opacity: 0; } }
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="back-btn" aria-label="Home" hidden></button>
  <div class="title"><span class="mark" aria-hidden="true"></span>Pigeonhole</div>
  <span class="pill" id="net-pill" hidden></span>
  <button class="icon-btn" id="settings-btn" aria-label="Settings" hidden></button>
</header>
<div id="fatal" hidden></div>
<main id="app"><p class="boot">Loading…</p></main>
<div class="bin" id="bin" aria-hidden="true"></div>
<div id="toast" aria-live="polite"></div>

<script>
'use strict';

// If anything in this script ever throws, say so on screen instead of leaving a blank page.
function showFatal(msg) {
  var el = document.getElementById('fatal');
  el.hidden = false;
  el.textContent = 'Something went wrong: ' + msg + '. Try reloading; if it keeps happening, tell Claude this exact message.';
}
window.addEventListener('error', function (e) { showFatal(e.message || 'script error'); });
window.addEventListener('unhandledrejection', function (e) { showFatal((e.reason && e.reason.message) || String(e.reason)); });

const APP_VERSION = '1.4.0';
const BASE = 'appxjiuh85jwY8bKO';
const TABLE = { CATEGORIES: 'tblcfRSlMxBl5d0Yu', PENDING: 'tbl6xMBhSmwZG1VFp', SENDERS: 'tblYmI2Da9Kvue9iu' };

// Pending table field IDs. Airtable's display names for the first three are
// mislabelled; these IDs match what the scheduled triage task actually writes.
const P = {

    lsSet(LAST_RUN_KEY, String(Date.now()));
    toast('Sweep started — about 10 minutes');
    refreshTimers.forEach(clearTimeout);
    refreshTimers = [4, 8, 12, 16].map((min) => setTimeout(() => { if (!S.busy && (S.view === 'home' || (S.view === 'triage' && !S.queue.length))) loadData(); }, min * 60000));
  } catch (e) {
    S.runError = e.message;
  } finally {
    S.runBusy = false; render();
  }
}

// ---------- motion ----------
function animateCard(kind) {
  const card = $('.card.top');
  if (!card || reduceMotion()) return Promise.resolve();
  return new Promise((resolve) => {
    let finished = false;
    const done = () => { if (!finished) { finished = true; resolve(); } };
    if (kind === 'delete') {
      const bin = $('#bin');
      bin.innerHTML = I.bin;
      bin.classList.remove('show'); void bin.offsetWidth; bin.classList.add('show');
      setTimeout(() => bin.classList.remove('show'), 950);
    }
    const behind = $('.card.behind');
    card.classList.add('out-' + kind);
    if (behind) { behind.style.transition = 'transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s'; behind.style.transform = 'none'; behind.style.opacity = '1'; }
    card.addEventListener('animationend', (ev) => { if (ev.target === card) done(); });
    setTimeout(done, kind === 'delete' ? 700 : 560); // in case animationend never fires
  });
}
async function closeSheet() {
  const ov = $('.overlay');
  if (ov && !reduceMotion()) { ov.classList.add('closing'); await wait(170); }
  S.sheet = null;
}
async function withCard(kind, fn) {
  if (S.busy) return;
  S.busy = true;
  try { await animateCard(kind); await fn(); } finally { S.busy = false; }
}

// ---------- actions ----------
async function saveToken() {
  const input = $('#pat-input');
  const v = (input ? input.value : '').trim();
  S.setupError = '';
  if (!/^pat\w{8,}\.\w{20,}$/.test(v)) {
    S.setupError = 'That doesn’t look like an Airtable token — it should start with “pat” and contain a dot.';
    return render();
  }
  if (!S.online) { S.setupError = 'You’re offline — connect to the internet so the token can be checked.'; return render(); }
  S.setupBusy = true; render();
  try {
    await airtable(TABLE.CATEGORIES, { pat: v, params: new URLSearchParams({ pageSize: '1', returnFieldsByFieldId: 'true' }) });
    await TokenStore.save(v);
    S.setupBusy = false; S.loadError = '';
    $('#pat-input').value = '';
    go('home');
    await loadData();
    flush();
  } catch (e) {
    S.setupBusy = false;
    S.setupError = e.status === 401 || e.status === 403 || e.status === 404
      ? 'Airtable rejected this token (' + e.message + '). Check it has data.records:read and data.records:write on the Email Triage v2 base.'
      : e.message;
    render();
  }
}

async function createCategory() {
  const sh = S.sheet;
  const input = $('#cat-name-input');
  const name = (input ? input.value : '').trim();
  if (!name) { sh.error = 'Give it a name.'; return render(); }
  if (!sh.disposition) { sh.error = 'Choose Archive, Keep, or Delete.'; return render(); }
  if (categoryByName(name)) { sh.error = 'A category called “' + name + '” already exists.'; return render(); }
  sh.busy = true; sh.error = ''; render();
  try {
    const fields = {}; fields[C.NAME] = name; fields[C.DISPOSITION] = sh.disposition;
    const res = await airtable(TABLE.CATEGORIES, { method: 'POST', body: { records: [{ fields }] } });
    const cat = mapCategory(res.records[0]);
    S.categories = S.categories.concat([cat]).sort((a, b) => a.name.localeCompare(b.name));
    const fromCard = sh.from === 'card';
    const cardEmail = S.queue[0];
    S.sheet = null;
    if (fromCard && cardEmail) S.overrides[cardEmail.id] = cat.name;
    saveCache();
    toast('“' + cat.name + '” created — Gmail label is set up at the next scheduled run');
    render();
  } catch (e) {
    sh.busy = false; sh.error = e.message; render();
  }
}
async function saveCategoryEdit() {
  const sh = S.sheet;
  const cat = S.categories.find((c) => c.id === sh.id);
  if (!cat) { S.sheet = null; return render(); }
  const input = $('#cat-name-input');
  const newName = (input ? input.value : '').trim();
  if (!newName) { sh.error = 'Give it a name.'; return render(); }
  if (!sh.disposition) { sh.error = 'Choose Archive, Keep, or Delete.'; return render(); }
  const dupe = categoryByName(newName);
  if (dupe && dupe.id !== cat.id) { sh.error = 'Another category is already called “' + newName + '”.'; return render(); }
  const oldName = cat.name;
  const renamed = newName !== oldName;
  sh.busy = true; sh.error = ''; render();
  try {
    const fields = {}; fields[C.NAME] = newName; fields[C.DISPOSITION] = sh.disposition;
    await airtable(TABLE.CATEGORIES, { method: 'PATCH', body: { records: [{ id: cat.id, fields }] } });
    let fixed = 0;
    if (renamed) {
      const rows = await listAll(TABLE.SENDERS);
      const toFix = rows.filter((r) => ((r.fields || {})[SR.CATEGORY] || '') === oldName);
      for (let i = 0; i < toFix.length; i += 10) {
        const chunk = toFix.slice(i, i + 10).map((r) => { const f = {}; f[SR.CATEGORY] = newName; return { id: r.id, fields: f }; });
        await airtable(TABLE.SENDERS, { method: 'PATCH', body: { records: chunk } });
      }
      fixed = toFix.length;
    }
    cat.name = newName; cat.disposition = sh.disposition;
    S.categories.sort((a, b) => a.name.localeCompare(b.name));
    Object.keys(S.overrides).forEach((id) => { if (S.overrides[id] === oldName) S.overrides[id] = newName; });
    saveCache();
    S.sheet = null;
    toast(renamed
      ? '“' + oldName + '” renamed to “' + newName + '”' + (fixed ? ' · updated ' + fixed + ' learned sender rule' + (fixed > 1 ? 's' : '') : '')
      : 'Saved');
    render();
  } catch (e) {
    sh.busy = false; sh.error = e.message; render();
  }
}

document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'overlay' && ev.target !== el) return; // clicks inside the sheet
  if (S.busy) return;
  const e = S.queue[0];
  switch (act) {
    case 'save-token': return saveToken();
    case 'home': return go(getPat() ? 'home' : 'setup');
    case 'settings': return go('settings');
    case 'start': return go('triage');
    case 'refresh': return loadData();
    case 'skip':
      if (!e || S.queue.length < 2) return;
      return withCard('skip', async () => { S.queue.push(S.queue.shift()); saveCache(); S.enter = true; render(); });
    case 'open-category': S.sheet = { type: 'category' }; $('#toast').innerHTML = ''; return render();
    case 'pick-category': {
      const c = categoryByName(el.dataset.cat);
      if (!e || !c) return;
      if (categoryByName(e.suggested) === c) delete S.overrides[e.id]; else S.overrides[e.id] = c.name;
      saveCache();
      await closeSheet();
      S.pulseChip = true;
      return render();   // back to the same card — Nick then chooses File / Delete / Skip
    }
    case 'file': {
      if (!e) return;
      const c = chosenCategory(e);
      if (!c) { S.sheet = { type: 'category' }; $('#toast').innerHTML = ''; return render(); } // nothing to file to yet — pick one first
      return withCard(c.disposition === 'Delete' ? 'delete' : 'file', () => decide(e, { category: c.name, action: c.disposition || 'Archive' }));
    }
    case 'open-delete': S.sheet = { type: 'delete' }; $('#toast').innerHTML = ''; return render();
    case 'pick-reason': S.sheet = { type: 'confirm', reason: el.dataset.reason }; return render();
    case 'close': case 'overlay': await closeSheet(); return render();
    case 'confirm-delete': {
      if (!e || !S.sheet) return;
      const reason = S.sheet.reason;
      await closeSheet(); render();
      return withCard('delete', () => decide(e, { action: 'Delete', reason }));
    }
    case 'open-new-category':
      S.sheet = { type: 'new-category', name: '', disposition: '', from: el.dataset.from || 'settings', error: '', busy: false };
      S.sheetJustOpened = true;
      return render();
    case 'edit-category': {
      const cat = S.categories.find((c) => c.id === el.dataset.id);
      if (!cat) return;
      S.sheet = { type: 'edit-category', id: cat.id, name: cat.name, disposition: cat.disposition || '', error: '', busy: false };
      S.sheetJustOpened = true;
      return render();
    }
    case 'set-disposition':
      if (S.sheet) { S.sheet.disposition = el.dataset.value; S.sheet.error = ''; }
      return render();
    case 'create-category': return createCategory();
    case 'save-category': return saveCategoryEdit();
    case 'change-token': S.setupError = ''; return go('setup');
    case 'forget-token':
      await TokenStore.clear(); lsDel(CACHE_KEY); lsDel(OVERRIDE_KEY); S.queue = []; S.categories = []; S.overrides = {}; S.lastLoaded = 0; S.setupError = '';
      return go('setup');
    case 'sync-now': return flush();
    case 'run-now': return runSweep();
    case 'retry': {
      const d = S.outbox.find((x) => x.recordId === el.dataset.id);
      if (d) { d.status = 'queued'; d.error = ''; d.attempts = 0; await Outbox.put(d); await refreshOutbox(); render(); flush(); }
      return;
    }
    case 'discard': {
      await Outbox.del(el.dataset.id); await refreshOutbox();
      toast('Discarded — tap Refresh on the home screen to see that email again');
      return render();
    }
  }
});

$('#settings-btn').innerHTML = I.gear;
$('.title .mark').innerHTML = [0,0,1,1,0,0,0,1,0].map((on) => '<i' + (on ? ' class="on"' : '') + '></i>').join('');
$('#back-btn').innerHTML = I.back;
$('#settings-btn').addEventListener('click', () => { if (!S.busy) go('settings'); });
$('#back-btn').addEventListener('click', () => { if (!S.busy) go(getPat() ? 'home' : 'setup'); });
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'pat-input') saveToken();
  if (ev.key === 'Escape' && S.sheet) { S.sheet = null; render(); }
});
window.addEventListener('online', () => { S.online = true; if (!S.busy) render(); flush(); });
window.addEventListener('offline', () => { S.online = false; if (!S.busy) render(); });
// Keep time-based labels (Run sweep cooldown, scheduled-run warnings) current while the app sits open.
setInterval(() => { if (!S.busy && !S.sheet && (S.view === 'home' || (S.view === 'triage' && !S.queue.length))) render(); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.online) flush();
});

// ---------- start ----------
(async function boot() {
  try { await refreshOutbox(); } catch (e) { S.outbox = []; }
  loadCache();
  try { await TokenStore.restore(); } catch (e) { /* keep going with whatever localStorage has */ }
  if (!getPat()) { go('setup'); return; }
  go('home');
  await loadData();
  flush();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
}
</script>
